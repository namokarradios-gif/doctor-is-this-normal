(function(){
  const mic = document.getElementById('recordingMic');
  if (!mic || !window.MediaRecorder) return;

  const NativeRecorder = window.MediaRecorder;

  function Recorder(stream, options) {
    const r = new NativeRecorder(stream, options);
    r.addEventListener('start', () => mic.classList.add('active'));
    r.addEventListener('stop', () => mic.classList.remove('active'));
    r.addEventListener('error', () => mic.classList.remove('active'));
    return r;
  }

  Recorder.prototype = NativeRecorder.prototype;
  window.MediaRecorder = Recorder;
})();
</script>
